<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Grounds Operations</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#16291F;color:#EDEBE5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
  .card{max-width:340px}
  h1{font-size:20px;margin:0 0 8px;color:#C9A84C}
  p{font-size:14px;line-height:1.5;color:rgba(237,235,229,.75);margin:0 0 18px}
  button{background:#C9A84C;color:#16291F;border:0;border-radius:999px;font-weight:700;font-size:14px;padding:11px 22px;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>No connection right now. Pages you've already opened still work — anything with live data (spray sheets, labels) will load again once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
